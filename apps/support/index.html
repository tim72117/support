<!doctype html>
<html lang="zh-Hant">
  <head>
    <!-- Google Analytics 4 (gtag.js)
         Loads only when a GA4 measurement id is configured (VITE_GA_ID in
         the app's .env; an unset variable is left as its literal token by
         Vite, which the percent-sign check below treats as "not configured")
         AND all of these hold:
           - VITE_DISABLE_ANALYTICS is not "1" (hard off switch, always wins)
           - Admin pages (any path under /admin) are never tracked
           - this is not the Vite dev server, UNLESS VITE_ANALYTICS_IN_DEV is
             "1" (set it in the git-ignored .env.local to test tracking
             locally). In that case debug_mode is on, so the events show up in
             GA's DebugView and can be excluded from the real reports with
             the "Developer traffic" data filter.
         Otherwise gtag.js is never even requested.
         window.__gaEnabled tells the page scripts whether to send custom
         events; they must check it and call gtag(), never touch dataLayer. -->
    <script>
      window.dataLayer = window.dataLayer || []
      window.gtag = function () { window.dataLayer.push(arguments) }
      window.__gaEnabled = false
      ;(function () {
        var id = '%VITE_GA_ID%'
        if (!id || id.indexOf('%') !== -1) return
        // Hard off switch: any non-empty value except 0 / false (an unset variable stays a literal%-token)
        var off = '%VITE_DISABLE_ANALYTICS%'
        if (off && off.indexOf('%') === -1 && off.toLowerCase() !== '0' && off.toLowerCase() !== 'false') return
        // Admin pages are never tracked. Judge the normalised path so /Admin, //admin, /%61dmin,
        // /admin%2Fx and /admin.html cannot slip through; an undecodable path counts as admin.
        var path
        try { path = decodeURIComponent(location.pathname) } catch (e) { return }
        if (/^\/admin(\/|\.|$)/.test(path.toLowerCase().replace(/\/{2,}/g, '/'))) return
        var dev = '%DEV%' === 'true'
        if (dev && '%VITE_ANALYTICS_IN_DEV%' !== '1') return
        window.__gaEnabled = true
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id)
        document.head.appendChild(s)
        window.gtag('js', new Date())
        var cfg = {}
        // Never report the query string or hash (they can carry tokens or dev parameters).
        cfg.page_location = location.origin + location.pathname
        if (dev) cfg.debug_mode = true
        window.gtag('config', id, cfg)
      })()
    </script>
    <!-- End Google Analytics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>線上客服</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

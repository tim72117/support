<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂閱方案｜候選人 AI 替身</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .plans { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: stretch; }
    .plan { position: relative; display: flex; flex-direction: column; cursor: pointer; }
    .plan input { position: absolute; opacity: 0; }
    .plan:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash), var(--shadow-card); }
    .plan:has(input:focus-visible) { outline: 3px solid var(--accent); }
    .plan .price { font-size: 1.8rem; font-weight: 800; margin: 4px 0 12px; }
    .plan .price small { font-size: .9rem; font-weight: 400; color: var(--ink-dim); }
    .plan ul { margin: 0 0 8px; padding-left: 1.2em; color: var(--ink-dim); font-size: .95rem; flex: 1; }
    .tag { position: absolute; top: -12px; right: 18px; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; padding: 2px 12px; border-radius: 999px; }
    .signup { max-width: 560px; margin: 0 auto; }
    label.field { display: block; margin-bottom: 16px; font-weight: 700; font-size: .95rem; }
    label.field input, label.field select { display: block; width: 100%; margin-top: 6px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
    label.field input:focus, label.field select:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    .summary { background: var(--brand-wash); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 16px; }
    .done { text-align: center; max-width: 560px; margin: 40px auto 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="../index.html">ai-support</a>
      <div class="links"><a href="./index.html">← 返回介紹</a></div>
    </nav>
  </div>

  <main class="wrap" style="padding-bottom:48px">
    <div class="section-title" style="padding-top:24px">
      <h1>選擇你的方案</h1>
      <p>依選舉階段選擇，之後都能升級或取消。</p>
    </div>

    <form id="signup" novalidate>
      <div class="plans" role="radiogroup" aria-label="訂閱方案">
        <label class="card plan">
          <input type="radio" name="plan" value="starter" data-name="參選起步" data-price="NT$ 990 / 月" />
          <h3>參選起步</h3>
          <div class="price">NT$ 990 <small>/ 月</small></div>
          <ul><li>1 個 AI 替身與專屬頁面</li><li>政見、政績內容管理</li><li>每月 500 則選民對話</li></ul>
        </label>
        <label class="card plan">
          <span class="tag">最多人選擇</span>
          <input type="radio" name="plan" value="campaign" data-name="競選衝刺" data-price="NT$ 2,990 / 月" checked />
          <h3>競選衝刺</h3>
          <div class="price">NT$ 2,990 <small>/ 月</small></div>
          <ul><li>包含起步方案全部功能</li><li>文案與宣傳頁面產生</li><li>選民陳情分類整理</li><li>每月 5,000 則選民對話</li></ul>
        </label>
        <label class="card plan">
          <input type="radio" name="plan" value="team" data-name="團隊服務" data-price="洽詢報價" />
          <h3>團隊服務</h3>
          <div class="price">洽詢報價</div>
          <ul><li>多位候選人 / 多個服務據點</li><li>團隊成員協作與審核流程</li><li>專人協助導入</li></ul>
        </label>
      </div>
      <p class="note" style="text-align:center;margin-top:12px">價格為示意，正式上線前會調整。</p>

      <div class="signup">
        <h2 style="margin-top:36px">建立帳號</h2>
        <div class="summary" id="summary" aria-live="polite"></div>
        <label class="field">候選人 / 團隊名稱<input name="name" autocomplete="organization" required /></label>
        <label class="field">參選層級
          <select name="level">
            <option>里長 / 村長</option><option>議員</option><option>縣市首長</option><option>立法委員</option><option>其他</option>
          </select>
        </label>
        <label class="field">聯絡 Email<input type="email" name="email" autocomplete="email" required /></label>
        <p id="error" class="note" style="color:#c0392b" role="alert" hidden></p>
        <button class="btn" type="submit" style="width:100%">送出訂閱申請</button>
      </div>
    </form>

    <div class="done card" id="done" hidden>
      <h2>已收到你的申請 🎉</h2>
      <p id="doneText"></p>
      <p class="note">這是示範頁面，尚未串接金流與後端，資料不會被送出或儲存。</p>
      <a class="btn ghost" href="./index.html">回到介紹頁</a>
    </div>
  </main>

  <script>
    const form = document.getElementById('signup')
    const summary = document.getElementById('summary')
    const err = document.getElementById('error')
    const selected = () => form.querySelector('input[name=plan]:checked')
    const renderSummary = () => {
      const p = selected()
      summary.textContent = '已選方案：' + p.dataset.name + '（' + p.dataset.price + '）'
    }
    form.addEventListener('change', renderSummary)
    renderSummary()
    form.addEventListener('submit', (e) => {
      e.preventDefault()
      // 判斷與使用的是同一份 trim 過的值
      const name = form.elements.name.value.trim()
      const email = form.elements.email.value.trim()
      const ok = name !== '' && /^\S+@\S+\.\S+$/.test(email)
      err.hidden = ok
      if (!ok) { err.textContent = '請填寫名稱與正確的 Email。'; return }
      const p = selected()
      document.getElementById('doneText').textContent =
        name + '，你選擇了「' + p.dataset.name + '」方案，我們會寄信到 ' + email + '。'
      form.hidden = true
      document.getElementById('done').hidden = false
    })
  </script>
</body>
</html>

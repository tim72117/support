<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂閱方案｜候選人 AI 替身</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .plans { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: stretch; }
    .plan { position: relative; display: flex; flex-direction: column; cursor: pointer; }
    .plan input { position: absolute; opacity: 0; }
    .plan:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash), var(--shadow-card); }
    .plan:has(input:focus-visible) { outline: 3px solid var(--accent); }
    .plan .price { font-size: 1.8rem; font-weight: 800; margin: 4px 0 12px; }
    .plan .price small { font-size: .9rem; font-weight: 400; color: var(--ink-dim); }
    .plan ul { margin: 0 0 8px; padding-left: 1.2em; color: var(--ink-dim); font-size: .95rem; flex: 1; }
    .tag { position: absolute; top: -12px; right: 18px; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; padding: 2px 12px; border-radius: 999px; }
    .signup { max-width: 560px; margin: 0 auto; }
    label.field { display: block; margin-bottom: 16px; font-weight: 700; font-size: .95rem; }
    label.field input:not([type=radio]) { display: block; width: 100%; margin-top: 6px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
    label.field input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    .summary { background: var(--brand-wash); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 16px; }
    .done { text-align: center; max-width: 560px; margin: 40px auto 0; }
    .tpfield { height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; margin-top: 6px; }
    .tpfield.tappay-field-focus { border-color: var(--brand); }
    .tpfield.has-error { border-color: #c0392b; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1 1 160px; }
    .modes { display: flex; gap: 20px; margin-bottom: 14px; font-weight: 700; font-size: .95rem; }
    .modes label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .who { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bg-sunken); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 16px; }
    .linkbtn { background: none; border: none; padding: 0; color: var(--brand-strong); text-decoration: underline; cursor: pointer; font: inherit; }
    .banner { border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; background: var(--accent-wash); font-size: .9rem; }
    .msg-error { color: #c0392b; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="../index.html">ai-support</a>
      <div class="links"><a href="./index.html">← 返回介紹</a><a class="btn ghost sm" data-console-link href="http://localhost:5177">登入</a></div>
    </nav>
  </div>

  <main class="wrap" style="padding-bottom:48px">
    <div class="section-title" style="padding-top:24px">
      <h1>選擇你的方案</h1>
      <p>依選舉階段選擇，之後都能升級或取消。</p>
    </div>

    <div class="banner" id="banner" hidden></div>

    <form id="signup" novalidate>
      <div class="plans" role="radiogroup" aria-label="訂閱方案">
        <label class="card plan">
          <input type="radio" name="plan" value="starter" data-name="參選起步" data-price="NT$ 990 / 月" />
          <h3>參選起步</h3>
          <div class="price">NT$ 990 <small>/ 月</small></div>
          <ul><li>1 個 AI 替身與專屬頁面</li><li>政見、政績內容管理</li><li>每月 500 則選民對話</li></ul>
        </label>
        <label class="card plan">
          <span class="tag">最多人選擇</span>
          <input type="radio" name="plan" value="campaign" data-name="競選衝刺" data-price="NT$ 2,990 / 月" checked />
          <h3>競選衝刺</h3>
          <div class="price">NT$ 2,990 <small>/ 月</small></div>
          <ul><li>包含起步方案全部功能</li><li>文案與宣傳頁面產生</li><li>選民陳情分類整理</li><li>每月 5,000 則選民對話</li></ul>
        </label>
      </div>
      <p class="note" style="text-align:center;margin-top:12px">價格為示意，正式上線前會調整。</p>

      <div class="signup">
        <h2 style="margin-top:36px">1. 你的帳號</h2>
        <div class="summary" id="summary" aria-live="polite"></div>
        <div class="who" id="who" hidden>
          <span>已登入：<b id="whoEmail"></b></span>
          <button type="button" class="linkbtn" id="switchAccount">切換帳號</button>
        </div>
        <div id="accountFields">
          <div class="modes" role="radiogroup" aria-label="帳號">
            <label><input type="radio" name="mode" value="register" checked /> 建立新帳號</label>
            <label><input type="radio" name="mode" value="login" /> 我已有帳號</label>
          </div>
          <label class="field">聯絡 Email<input type="email" name="email" autocomplete="email" /></label>
          <label class="field"><span id="pwLabel">設定密碼（至少 8 個字元）</span><input type="password" name="password" autocomplete="new-password" /></label>
        </div>

        <h2 style="margin-top:28px">2. 付款資料</h2>
        <p class="note">信用卡資料直接送到 TapPay，不會經過我們的伺服器。</p>
        <label class="field">團隊名稱<input name="name" autocomplete="organization" /></label>
        <label class="field">手機號碼<input name="phone" inputmode="tel" autocomplete="tel" /></label>
        <label class="field">卡號<div id="card-number" class="tpfield"></div></label>
        <div class="row">
          <label class="field">到期日 (MM/YY)<div id="card-exp" class="tpfield"></div></label>
          <label class="field">安全碼<div id="card-ccv" class="tpfield"></div></label>
        </div>
        <p id="error" class="note msg-error" role="alert" hidden></p>
        <button class="btn" type="submit" id="submitBtn" style="width:100%" disabled>確認並付款</button>
      </div>
    </form>

    <div class="done card" id="done" hidden>
      <h2>訂閱完成 🎉</h2>
      <p id="doneText"></p>
      <a class="btn" id="goConsole" href="#">進入管理後台</a>
    </div>
  </main>

  <script src="https://js.tappaysdk.com/sdk/tpdirect/v5.19.2"></script>
  <script>
    // 後端與管理後台的位址；開發時可用 ?api=...&console=... 覆寫。
    const params = new URLSearchParams(location.search)
    const API = (params.get('api') || 'http://localhost:8082').replace(/\/+$/, '')
    const CONSOLE_URL = params.get('console') || 'http://localhost:5177'

    const $ = (id) => document.getElementById(id)
    const form = $('signup')
    const err = $('error')
    const state = { billing: false, sdkReady: false, canGetPrime: false, email: null, busy: false }

    const selected = () => form.querySelector('input[name=plan]:checked')
    const mode = () => form.querySelector('input[name=mode]:checked').value

    async function api(path, opts = {}) {
      let res
      try {
        res = await fetch(API + path, {
          method: opts.method || (opts.body ? 'POST' : 'GET'),
          credentials: 'include',
          headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        })
      } catch {
        throw Object.assign(new Error('連不上伺服器，請稍後再試'), { status: 0 })
      }
      const text = await res.text()
      if (!res.ok) throw Object.assign(new Error(text.trim() || 'HTTP ' + res.status), { status: res.status })
      return text ? JSON.parse(text) : null
    }

    function showError(msg) { err.textContent = msg; err.hidden = !msg }
    function showBanner(msg) { $('banner').textContent = msg; $('banner').hidden = !msg }
    function renderSummary() {
      const p = selected()
      $('summary').textContent = '已選方案：' + p.dataset.name + '（' + p.dataset.price + '）'
    }
    function updateSubmit() {
      $('submitBtn').disabled = state.busy || !(state.billing && state.sdkReady && state.canGetPrime)
    }

    function renderAccount() {
      const loggedIn = !!state.email
      $('who').hidden = !loggedIn
      $('accountFields').hidden = loggedIn
      if (loggedIn) $('whoEmail').textContent = state.email
      const reg = mode() === 'register'
      $('pwLabel').textContent = reg ? '設定密碼（至少 8 個字元）' : '密碼'
      form.elements.password.autocomplete = reg ? 'new-password' : 'current-password'
    }

    async function init() {
      renderSummary(); renderAccount()
      try {
        const me = await api('/auth/me')
        state.email = me.Email || me.email || null
      } catch { /* 未登入 */ }
      renderAccount()

      let cfg
      try { cfg = await api('/console/billing/config') } catch (e) {
        showBanner('目前無法連線到服務（' + e.message + '），暫時不能訂閱。')
        return
      }
      if (!cfg.enabled) { showBanner('付款功能尚未開放，請稍後再試。'); return }
      state.billing = true
      if (cfg.env === 'sandbox') showBanner('目前是測試環境：請使用 TapPay 提供的測試卡號，不會真的扣款。')
      setupTapPay(cfg)
    }

    function setupTapPay(cfg) {
      if (typeof TPDirect === 'undefined') { showError('付款元件載入失敗，請重新整理頁面。'); return }
      TPDirect.setupSDK(Number(cfg.appId), cfg.appKey, cfg.env)
      TPDirect.card.setup({
        fields: {
          number: { element: '#card-number', placeholder: '**** **** **** ****' },
          expirationDate: { element: '#card-exp', placeholder: 'MM / YY' },
          ccv: { element: '#card-ccv', placeholder: 'CCV' },
        },
        styles: { input: { color: '#2c2a28', 'font-size': '16px' }, '.invalid': { color: '#c0392b' } },
      })
      TPDirect.card.onUpdate((u) => {
        state.canGetPrime = !!u.canGetPrime
        $('card-number').classList.toggle('has-error', u.status.number === 2)
        $('card-exp').classList.toggle('has-error', u.status.expiry === 2)
        $('card-ccv').classList.toggle('has-error', u.status.ccv === 2)
        updateSubmit()
      })
      state.sdkReady = true
      updateSubmit()
    }

    function getPrime() {
      return new Promise((resolve, reject) => {
        TPDirect.card.getPrime((r) =>
          r.status === 0 ? resolve(r.card.prime) : reject(new Error('卡片資料有誤，請檢查後再試（' + r.msg + '）')))
      })
    }

    const payErrors = {
      402: '付款被銀行拒絕，請確認卡片資料或改用其他信用卡。',
      409: '這個帳號已經有進行中的訂閱，請直接進入管理後台。',
      502: '付款結果暫時無法確認。請先不要重複付款，並聯絡客服確認。',
      503: '付款功能尚未開放，請稍後再試。',
    }

    form.addEventListener('change', (e) => {
      if (e.target.name === 'plan') renderSummary()
      if (e.target.name === 'mode') renderAccount()
    })
    $('switchAccount').addEventListener('click', async () => {
      try { await api('/auth/logout', { method: 'POST' }) } catch { /* 忽略 */ }
      state.email = null; renderAccount()
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      if (state.busy || !state.billing) return
      showError('')
      // 判斷與使用的是同一份 trim 過的值
      const name = form.elements.name.value.trim()
      const phone = form.elements.phone.value.trim()
      const email = state.email || form.elements.email.value.trim()
      const password = form.elements.password.value // 密碼不 trim
      if (!name || !phone) return showError('請填寫團隊名稱與手機號碼。')
      if (!state.email) {
        if (!/^\S+@\S+\.\S+$/.test(email)) return showError('請填寫正確的 Email。')
        if (!password) return showError('請輸入密碼。')
        if (mode() === 'register' && password.length < 8) return showError('密碼至少需要 8 個字元。')
      }

      state.busy = true; updateSubmit(); $('submitBtn').textContent = '處理中…'
      try {
        if (!state.email) {
          await api(mode() === 'register' ? '/auth/register' : '/auth/login', { body: { email, password } })
          state.email = email; renderAccount()
        }
        const prime = await getPrime() // 拿到後立刻使用，避免過期
        const p = selected()
        await api('/console/billing/subscribe', {
          body: { tier: p.value, prime, cardholder: { name, email, phoneNumber: phone } },
        })
        $('goConsole').href = CONSOLE_URL
        $('doneText').textContent = '已為 ' + email + ' 開通「' + p.dataset.name + '」。'
        form.hidden = true; showBanner(''); $('done').hidden = false
      } catch (e2) {
        showError(payErrors[e2.status] || e2.message || '發生錯誤，請稍後再試。')
      } finally {
        state.busy = false; $('submitBtn').textContent = '確認並付款'; updateSubmit()
      }
    })

    init()
  </script>
  <script type="module" src="../assets/site.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂閱方案｜有問必答 店家版</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .plans { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: stretch; }
    .plan { position: relative; display: flex; flex-direction: column; cursor: pointer; }
    .plan input { position: absolute; opacity: 0; }
    .plan:has(input:checked) { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash), var(--shadow-card); }
    .plan:has(input:focus-visible) { outline: 3px solid var(--accent); }
    .plan .price { font-size: 1.8rem; font-weight: 800; margin: 4px 0 12px; }
    .plan .price small { font-size: .9rem; font-weight: 400; color: var(--ink-dim); }
    .plan ul { margin: 0 0 8px; padding-left: 1.2em; color: var(--ink-dim); font-size: .95rem; flex: 1; }
    .plan .choose { margin-top: 12px; width: 100%; text-align: center; }
    .tag { position: absolute; top: -12px; right: 18px; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; padding: 2px 12px; border-radius: 999px; }
    .auth { max-width: 420px; margin: 0 auto; }
    label.field { display: block; margin-bottom: 16px; font-weight: 700; font-size: .95rem; }
    label.field input:not([type=radio]) { display: block; width: 100%; margin-top: 6px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
    label.field input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    .summary { background: var(--brand-wash); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 16px; }
    .modes { display: flex; gap: 20px; margin-bottom: 14px; font-weight: 700; font-size: .95rem; }
    .modes label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .linkbtn { background: none; border: none; padding: 0; color: var(--brand-strong); text-decoration: underline; cursor: pointer; font: inherit; }
    .banner { border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; background: var(--accent-wash); font-size: .9rem; }
    .msg-error { color: #c0392b; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="../index.html">有問必答 <span class="badge-ai" style="margin-left:4px">店家版</span></a>
      <div class="links"><a href="./index.html">← 返回介紹</a><a class="btn ghost sm" data-console-link href="http://localhost:5177">登入</a></div>
    </nav>
  </div>

  <main class="wrap" style="padding-bottom:48px">
    <div class="section-title" style="padding-top:24px" id="step1Title">
      <h1>選擇你的方案</h1>
      <p>依店家規模選擇，之後都能升級或取消。</p>
    </div>

    <div class="banner" id="banner" hidden></div>

    <section id="step1">
      <div class="plans" id="plans" role="radiogroup" aria-label="訂閱方案">
        <div class="card plan" data-plan="starter" data-name="輕量起步" data-price="NT$ 490 / 月">
          <h3>輕量起步</h3>
          <div class="price">NT$ 490 <small>/ 月</small></div>
          <ul><li>1 個 AI 小幫手與專屬頁面</li><li>內容與吉祥物設定</li><li>每月 500 則顧客對話</li></ul>
          <button type="button" class="btn choose" data-plan="starter">選擇這個方案</button>
        </div>
        <div class="card plan" data-plan="growth" data-name="成長方案" data-price="NT$ 990 / 月">
          <span class="tag">最多人選擇</span>
          <h3>成長方案</h3>
          <div class="price">NT$ 990 <small>/ 月</small></div>
          <ul><li>包含起步方案全部功能</li><li>多個分類內容卡片</li><li>每月 2,000 則顧客對話</li></ul>
          <button type="button" class="btn choose" data-plan="growth">選擇這個方案</button>
        </div>
      </div>
      <p class="note" style="text-align:center;margin-top:12px">可隨時升級或取消訂閱。</p>
    </section>

    <section id="step2" class="auth" hidden>
      <h2>登入或建立帳號</h2>
      <div class="summary" id="summary" aria-live="polite"></div>
      <p class="note"><button type="button" class="linkbtn" id="backToPlans">← 重新選擇方案</button></p>

      <form id="authform" novalidate>
        <div class="modes" role="radiogroup" aria-label="帳號">
          <label><input type="radio" name="mode" value="register" checked /> 建立新帳號</label>
          <label><input type="radio" name="mode" value="login" /> 我已有帳號</label>
        </div>
        <label class="field">聯絡 Email<input type="email" name="email" autocomplete="email" /></label>
        <label class="field"><span id="pwLabel">設定密碼（至少 8 個字元）</span><input type="password" name="password" autocomplete="new-password" /></label>
        <p id="error" class="note msg-error" role="alert" hidden></p>
        <button class="btn" type="submit" id="submitBtn" style="width:100%">繼續到付款</button>
      </form>
    </section>
  </main>

  <script>
    // 後端位址；開發時可用 ?api=... 覆寫。
    const params = new URLSearchParams(location.search)
    const API = (params.get('api') || 'http://localhost:8082').replace(/\/+$/, '')

    const $ = (id) => document.getElementById(id)
    const authform = $('authform')
    const err = $('error')
    const state = { email: null, busy: false, plan: null }

    async function api(path, opts = {}) {
      let res
      try {
        res = await fetch(API + path, {
          method: opts.method || (opts.body ? 'POST' : 'GET'),
          credentials: 'include',
          headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        })
      } catch {
        throw Object.assign(new Error('連不上伺服器，請稍後再試'), { status: 0 })
      }
      const text = await res.text()
      if (!res.ok) throw Object.assign(new Error(text.trim() || 'HTTP ' + res.status), { status: res.status })
      return text ? JSON.parse(text) : null
    }

    function showError(msg) { err.textContent = msg; err.hidden = !msg }
    function showBanner(msg) { $('banner').textContent = msg; $('banner').hidden = !msg }
    const mode = () => authform.querySelector('input[name=mode]:checked').value

    function planCard(key) { return document.querySelector('.plan[data-plan="' + key + '"]') }

    function goToPay(planKey) {
      location.href = './pay.html?plan=' + encodeURIComponent(planKey) +
        (params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '') +
        (params.get('console') ? '&console=' + encodeURIComponent(params.get('console')) : '')
    }

    function showStep2(planKey) {
      state.plan = planKey
      const card = planCard(planKey)
      $('summary').textContent = '已選方案：' + card.dataset.name + '（' + card.dataset.price + '）'
      $('step1').hidden = true
      $('step1Title').hidden = true
      $('step2').hidden = false
    }

    function showStep1() {
      $('step1').hidden = false
      $('step1Title').hidden = false
      $('step2').hidden = true
    }

    document.querySelectorAll('.choose').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const planKey = btn.dataset.plan
        if (state.email) {
          // 已登入，直接跳到付款頁
          goToPay(planKey)
          return
        }
        showStep2(planKey)
      })
    })

    $('backToPlans').addEventListener('click', showStep1)

    authform.addEventListener('change', (e) => {
      if (e.target.name === 'mode') {
        const reg = mode() === 'register'
        $('pwLabel').textContent = reg ? '設定密碼（至少 8 個字元）' : '密碼'
        authform.elements.password.autocomplete = reg ? 'new-password' : 'current-password'
      }
    })

    authform.addEventListener('submit', async (e) => {
      e.preventDefault()
      if (state.busy || !state.plan) return
      showError('')
      const email = authform.elements.email.value.trim()
      const password = authform.elements.password.value // 密碼不 trim
      if (!/^\S+@\S+\.\S+$/.test(email)) return showError('請填寫正確的 Email。')
      if (!password) return showError('請輸入密碼。')
      if (mode() === 'register' && password.length < 8) return showError('密碼至少需要 8 個字元。')

      state.busy = true; $('submitBtn').disabled = true; $('submitBtn').textContent = '處理中…'
      try {
        await api(mode() === 'register' ? '/auth/register' : '/auth/login', { body: { email, password } })
        state.email = email
        goToPay(state.plan)
      } catch (e2) {
        showError(e2.message || '發生錯誤，請稍後再試。')
      } finally {
        state.busy = false; $('submitBtn').disabled = false; $('submitBtn').textContent = '繼續到付款'
      }
    })

    async function init() {
      try {
        const me = await api('/auth/me')
        state.email = me.Email || me.email || null
      } catch { /* 未登入 */ }
      if (state.email) showBanner('已登入：' + state.email + '，選擇方案後將直接前往付款頁。')
    }

    init()
  </script>
  <script type="module" src="../assets/site.js"></script>
</body>
</html>
